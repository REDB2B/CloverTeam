<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="petal-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d42" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="petal-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="petal-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="petal-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="44" fill="#07090e" />

  <!-- Petal Top-Left: Green / Emerald -->
  <path d="M93 93 L93 52 C93 35 68 30 55 45 C42 60 50 85 68 93 Z" fill="url(#petal-green)" filter="url(#glow-green)" opacity="0.95" />
  
  <!-- Petal Top-Right: Yellow -->
  <path d="M107 93 L107 52 C107 35 132 30 145 45 C158 60 150 85 132 93 Z" fill="url(#petal-yellow)" filter="url(#glow-yellow)" opacity="0.95" />

  <!-- Petal Bottom-Left: Cyan / Blue -->
  <path d="M93 107 L93 148 C93 165 68 170 55 155 C42 140 50 115 68 107 Z" fill="url(#petal-cyan)" filter="url(#glow-cyan)" opacity="0.95" />

  <!-- Petal Bottom-Right: Orange -->
  <path d="M107 107 L107 148 C107 165 132 170 145 155 C158 140 150 115 132 107 Z" fill="url(#petal-orange)" filter="url(#glow-orange)" opacity="0.95" />

  <!-- Center core glow -->
  <circle cx="100" cy="100" r="7" fill="#ffffff" opacity="0.8" />
</svg>
